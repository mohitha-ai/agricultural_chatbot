<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriGuide AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top left,rgba(76,175,80,.22),transparent 35%),radial-gradient(circle at bottom right,rgba(139,195,74,.18),transparent 35%),#07140b;color:#f4fff5;display:flex;align-items:center;justify-content:center;padding:20px}
.chatbot{width:min(900px,100%);height:min(760px,92vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(139,195,74,.28);border-radius:24px;background:rgba(10,28,15,.92);box-shadow:0 25px 80px rgba(0,0,0,.45);backdrop-filter:blur(16px)}
.header{display:flex;align-items:center;gap:14px;padding:22px 24px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(19,54,25,.55)}
.avatar{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;font-size:27px;background:linear-gradient(135deg,#66bb6a,#2e7d32);box-shadow:0 8px 25px rgba(76,175,80,.3)}
.header h1{font-size:22px;margin-bottom:4px}.header p{color:#a9c9ad;font-size:14px}
.messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.message{max-width:78%;padding:14px 17px;border-radius:17px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.bot{align-self:flex-start;background:#17351e;border:1px solid rgba(129,199,132,.13)}
.user{align-self:flex-end;background:linear-gradient(135deg,#388e3c,#66bb6a);color:white}
.typing{display:none;align-self:flex-start;color:#a9c9ad;font-size:14px;padding:4px 2px}
.input-area{display:flex;gap:10px;padding:18px;border-top:1px solid rgba(255,255,255,.08);background:rgba(5,18,9,.8)}
#messageInput{flex:1;border:1px solid rgba(139,195,74,.22);outline:none;border-radius:14px;padding:14px 16px;font-size:15px;color:white;background:#102417}
#messageInput::placeholder{color:#78917c}
#sendButton{border:none;border-radius:14px;padding:0 22px;cursor:pointer;font-weight:bold;color:white;background:linear-gradient(135deg,#43a047,#7cb342);transition:transform .2s ease,opacity .2s ease}
#sendButton:hover{transform:translateY(-1px)}#sendButton:disabled{opacity:.55;cursor:not-allowed;transform:none}
@media(max-width:600px){body{padding:0}.chatbot{height:100vh;border-radius:0}.messages{padding:18px}.message{max-width:88%}.input-area{padding:12px}#sendButton{padding:0 16px}}
</style>
</head>
<body>
<main class="chatbot">
<header class="header"><div class="avatar">🌱</div><div><h1>AgriGuide AI</h1><p>Agriculture-focused AI learning assistant</p></div></header>
<section class="messages" id="messages">
<div class="message bot">Hello! 🌱 I'm AgriGuide AI. Ask me anything related to agriculture and agriculture studies.</div>
<div class="typing" id="typing">AgriGuide AI is thinking...</div>
</section>
<form class="input-area" id="chatForm">
<input id="messageInput" type="text" placeholder="Ask an agriculture question..." autocomplete="off" required>
<button id="sendButton" type="submit">Send</button>
</form>
</main>
<script>
const form=document.getElementById("chatForm"),input=document.getElementById("messageInput"),messages=document.getElementById("messages"),typing=document.getElementById("typing"),sendButton=document.getElementById("sendButton");
function addMessage(text,type){const message=document.createElement("div");message.className=`message ${type}`;message.textContent=text;messages.insertBefore(message,typing);messages.scrollTop=messages.scrollHeight}
form.addEventListener("submit",async event=>{event.preventDefault();const message=input.value.trim();if(!message)return;addMessage(message,"user");input.value="";typing.style.display="block";sendButton.disabled=true;messages.scrollTop=messages.scrollHeight;try{const response=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});const data=await response.json();addMessage(response.ok?data.answer:(data.error||"Something went wrong."),"bot")}catch(error){addMessage("Unable to connect to the chatbot right now.","bot")}finally{typing.style.display="none";sendButton.disabled=false;input.focus()}});
</script>
</body>
</html>
